<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitSync - Settings</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/dashboardOwner.css">
    <link rel="shortcut icon" href="../assets/images/favicon.png" type="image/x-icon">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><img src="../assets/images/MainLogoDark.png" alt="mainLogo"></div>
            <nav class="sidebar-nav">
                <a href="./owner.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="./members.html" class="nav-item"><i data-lucide="users"></i> Members</a>
                <a href="./plans.html" class="nav-item"><i data-lucide="crown"></i> Plans</a>
                <a href="./payments.html" class="nav-item"><i data-lucide="credit-card"></i> Payments</a>
                <a href="./attendance.html" class="nav-item"><i data-lucide="calendar-check"></i> Attendance</a>
                <a href="./reports.html" class="nav-item"><i data-lucide="bar-chart-3"></i> Reports</a>
                <a href="./settings.html" class="nav-item active"><i data-lucide="settings"></i> Settings</a>
            </nav>
            <button id="logoutBtn" class="nav-item logout-btn"><i data-lucide="log-out"></i> Logout</button>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="navbar-left"><h2 style="font-size: 1.25rem; color: var(--text-clr); font-weight: 600;">Settings</h2></div>
                <div class="navbar-right">
                    <div class="user-profile">
                        <div class="user-avatar" id="userAvatar">SY</div>
                        <div class="user-info"><p class="user-name" id="userName">Owner</p><p class="user-role">Gym Owner</p></div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div class="card" style="max-width: 600px;">
                    <div class="card-header"><h3 class="card-title"><i data-lucide="user"></i> Profile Settings</h3></div>
                    <form id="settingsForm" style="display: flex; flex-direction: column; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="settingsName" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email (Read Only)</label>
                            <input type="email" id="settingsEmail" class="form-input" readonly style="background-color: var(--bg-light); cursor: not-allowed;">
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: fit-content;">Save Changes</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script type="module">
        import { supabase } from "../js/config/supabase.js";
        import { requireAuth } from "../js/auth/auth.guard.js";
        import { logout, getCurrentUser } from "../js/auth/auth.service.js";

        const profile = await requireAuth(['owner']);
        const authUser = await getCurrentUser();

        if (profile && authUser) {
            document.getElementById('userName').textContent = profile.full_name;
            document.getElementById('userAvatar').textContent = profile.full_name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            
            // Pre-fill form
            document.getElementById('settingsName').value = profile.full_name;
            document.getElementById('settingsEmail').value = authUser.email;
            lucide.createIcons();
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => await logout());

        // Handle Save
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newName = document.getElementById('settingsName').value;
            
            const { error } = await supabase.from('profiles').update({ full_name: newName }).eq('id', profile.id);
            
            if (error) {
                alert('Error updating profile: ' + error.message);
            } else {
                alert('Profile updated successfully!');
                document.getElementById('userName').textContent = newName;
                document.getElementById('userAvatar').textContent = newName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            }
        });
    </script>
</body>
</html>
