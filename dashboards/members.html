<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitSync - Members</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages/dashboardOwner.css" />
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <img src="../assets/images/MainLogoDark.png" alt="mainLogo" />
        </div>
        <nav class="sidebar-nav">
          <a href="./owner.html" class="nav-item"
            ><i data-lucide="layout-dashboard"></i> Dashboard</a
          >
          <a href="./members.html" class="nav-item active"
            ><i data-lucide="users"></i> Members</a
          >
          <a href="./plans.html" class="nav-item"
            ><i data-lucide="crown"></i> Plans</a
          >
          <a href="./attendance.html" class="nav-item"
            ><i data-lucide="calendar-check"></i> Attendance</a
          >
          <a href="./payments.html" class="nav-item"
            ><i data-lucide="credit-card"></i> Payments</a
          >
          <a href="#" class="nav-item"
            ><i data-lucide="settings"></i> Settings</a
          >
        </nav>
        <button id="logoutBtn" class="nav-item logout-btn">
          <i data-lucide="log-out"></i> Logout
        </button>
        <div class="sidebar-footer">
          <!-- The Live Sync Video -->
          <div class="sidebar-footer-text">
            <p class="sidebar-footer-title">FitSync v1.0</p>
            <p class="sidebar-footer-subtitle">
              Live Sync Active • Connected to Server
            </p>
          </div>
          <div class="sync-video-container">
            <video autoplay loop muted playsinline class="sync-video">
              <source
                src="../assets/videos/footer-_video.mp4"
                type="video/mp4"
              />
            </video>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="top-navbar">
          <div class="navbar-left">
            <div class="search-box" style="width: 400px">
              <i data-lucide="search"></i>
              <input
                type="text"
                id="memberSearch"
                placeholder="Search members by name or phone..."
              />
            </div>
          </div>
          <div class="navbar-right">
            <div class="user-profile">
              <div class="user-avatar" id="userAvatar">SY</div>
              <div class="user-info">
                <p class="user-name" id="userName">Owner</p>
                <p class="user-role">Gym Owner</p>
              </div>
            </div>
          </div>
        </header>

        <div class="page-content">
          <div class="card table-card">
            <div class="card-header">
              <h3 class="card-title">
                <i data-lucide="users"></i> All Members
              </h3>
              <button id="openMemberModalBtn" class="btn btn-primary">
                <i data-lucide="plus"></i> Add New Member
              </button>
            </div>
            <div class="table-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Avatar</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th>Join Date</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="membersTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- REUSE THE ADD MEMBER MODAL FROM OWNER.HTML -->
    <div id="addMemberModal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="card-title">Add New Member</h3>
          <button id="closeModalBtn" class="modal-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <form id="addMemberForm">
          <div class="form-group">
            <label class="form-label">Full Name</label
            ><input
              type="text"
              id="newMemberName"
              class="form-input"
              required
            />
          </div>
          <div class="form-group">
            <label class="form-label">Email (for login)</label
            ><input
              type="email"
              id="newMemberEmail"
              class="form-input"
              required
            />
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label
            ><input
              type="text"
              id="newMemberPhone"
              class="form-input"
              required
            />
          </div>
          <div class="form-group" style="display: flex; gap: 1rem">
            <div style="flex: 1">
              <label class="form-label">Status</label
              ><select id="newMemberStatus" class="form-input">
                <option value="active">Active</option>
                <option value="frozen">Frozen</option>
              </select>
            </div>
            <div style="flex: 1">
              <label class="form-label">Join Date</label
              ><input
                type="date"
                id="newMemberJoinDate"
                class="form-input"
                required
              />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" id="cancelModalBtn" class="btn btn-outline">
              Cancel
            </button>
            <button type="submit" id="saveMemberBtn" class="btn btn-primary">
              Save Member
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script type="module">
      import { supabase } from "../js/config/supabase.js";
      import { requireAuth } from "../js/auth/auth.guard.js";
      import { logout } from "../js/auth/auth.service.js";
      import {
        loadMembersData,
        deleteMember,
        attachDeleteListeners,
      } from "../js/pages/members-dashboard.js";
      const profile = await requireAuth(["owner", "admin"]);
      if (profile) {
        document.getElementById("userName").textContent = profile.full_name;
        document.getElementById("userAvatar").textContent = profile.full_name
          .split(" ")
          .map((n) => n[0])
          .join("")
          .substring(0, 2)
          .toUpperCase();
        await loadMembersData();
        attachDeleteListeners();

        lucide.createIcons();
      }
      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => await logout());

      // Search functionality
      document.getElementById("memberSearch").addEventListener("input", (e) => {
        loadMembersData(e.target.value);
      });

      // Modal Logic
      const modal = document.getElementById("addMemberModal");
      const openBtn = document.getElementById("openMemberModalBtn");
      const closeBtn = document.getElementById("closeModalBtn");
      const cancelBtn = document.getElementById("cancelModalBtn");
      const form = document.getElementById("addMemberForm");

      document.getElementById("newMemberJoinDate").valueAsDate = new Date();
      const openModal = () => {
        modal.style.display = "flex";
        lucide.createIcons();
      };
      const closeModal = () => {
        modal.style.display = "none";
        form.reset();
        document.getElementById("newMemberJoinDate").valueAsDate = new Date();
      };

      openBtn.addEventListener("click", openModal);
      closeBtn.addEventListener("click", closeModal);
      cancelBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });

      // Form Submit (Calls Edge Function)
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById("saveMemberBtn");
        saveBtn.disabled = true;
        saveBtn.textContent = "Creating...";

        const name = document.getElementById("newMemberName").value;
        const email = document.getElementById("newMemberEmail").value;
        const phone = document.getElementById("newMemberPhone").value;
        const status = document.getElementById("newMemberStatus").value;
        const joinDate = document.getElementById("newMemberJoinDate").value;

        try {
          const { data, error } = await supabase.functions.invoke(
            "create-member",
            { body: { name, email, phone, status, joinDate } },
          );
          if (error) throw error;
          if (data?.error) throw new Error(data.error);

          alert("Member added successfully!");
          closeModal();
          await loadMembersData();
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = "Save Member";
        }
      });
    </script>
  </body>
</html>
