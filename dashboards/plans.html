<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitSync - Membership Plans</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages/dashboardOwner.css" />
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <img src="../assets/images/MainLogoDark.png" alt="mainLogo" />
        </div>
        <nav class="sidebar-nav">
          <a href="./owner.html" class="nav-item"
            ><i data-lucide="layout-dashboard"></i> Dashboard</a
          >
          <a href="./members.html" class="nav-item"
            ><i data-lucide="users"></i> Members</a
          >
          <a href="#" class="nav-item"
            ><i data-lucide="user-check"></i> Trainers</a
          >
          <a href="./plans.html" class="nav-item active"
            ><i data-lucide="crown"></i> Plans</a
          >
          <a href="./attendance.html" class="nav-item"
            ><i data-lucide="calendar-check"></i> Attendance</a
          >
          <a href="./payments.html" class="nav-item"
            ><i data-lucide="credit-card"></i> Payments</a
          >
          <a href="#" class="nav-item"
            ><i data-lucide="settings"></i> Settings</a
          >
        </nav>
        <button id="logoutBtn" class="nav-item logout-btn">
          <i data-lucide="log-out"></i> Logout
        </button>
        <div class="sidebar-footer">
          <!-- The Live Sync Video -->
          <div class="sidebar-footer-text">
            <p class="sidebar-footer-title">FitSync v1.0</p>
            <p class="sidebar-footer-subtitle">
              Live Sync Active • Connected to Server
            </p>
          </div>
          <div class="sync-video-container">
            <video autoplay loop muted playsinline class="sync-video">
              <source
                src="../assets/videos/footer-_video.mp4"
                type="video/mp4"
              />
            </video>
          </div>
        </div>
      </aside>

      <!-- RIGHT: Main Content -->
      <main class="main-content">
        <header class="top-navbar">
          <div class="navbar-left">
            <h2 style="color: var(--text-clr); font-weight: 600">
              Membership Plans
            </h2>
          </div>
          <div class="navbar-right">
            <div class="user-profile">
              <div class="user-avatar" id="userAvatar">SY</div>
              <div class="user-info">
                <p class="user-name" id="userName">Owner</p>
                <p class="user-role">Gym Owner</p>
              </div>
            </div>
          </div>
        </header>

        <div class="page-content">
          <div class="card table-card">
            <div class="card-header">
              <h3 class="card-title"><i data-lucide="crown"></i> All Plans</h3>
              <button id="openPlanModalBtn" class="btn btn-primary">
                <i data-lucide="plus"></i> Add New Plan
              </button>
            </div>
            <div class="table-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Plan Name</th>
                    <th>Duration (Months)</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="plansTableBody">
                  <!-- JS will inject rows here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- ADD PLAN MODAL -->
    <div id="addPlanModal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="card-title">Add New Plan</h3>
          <button id="closePlanModalBtn" class="modal-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <form id="addPlanForm">
          <input type="hidden" id="editPlanId" />
          <div class="form-group">
            <label class="form-label">Plan Name</label>
            <input
              type="text"
              id="planName"
              class="form-input"
              placeholder="e.g., Premium Monthly"
              required
            />
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <input
              type="text"
              id="planDesc"
              class="form-input"
              placeholder="e.g., Full gym access + 2 PT sessions"
            />
          </div>
          <div class="form-group" style="display: flex; gap: 1rem">
            <div style="flex: 1">
              <label class="form-label">Duration (Months)</label>
              <input
                type="number"
                id="planDuration"
                class="form-input"
                placeholder="1"
                min="1"
                required
              />
            </div>
            <div style="flex: 1">
              <label class="form-label">Price (Rs.)</label>
              <input
                type="number"
                id="planPrice"
                class="form-input"
                placeholder="5000"
                min="0"
                step="0.01"
                required
              />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="cancelPlanModalBtn"
              class="btn btn-outline"
            >
              Cancel
            </button>
            <button type="submit" id="savePlanBtn" class="btn btn-primary">
              Save Plan
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script type="module">
      import { supabase } from "../js/config/supabase.js";
      import { requireAuth } from "../js/auth/auth.guard.js";
      import { logout } from "../js/auth/auth.service.js";
      import {
        loadPlansData,
        deletePlan,
        openEditModal,
        resetPlanModal,
      } from "../js/pages/plans-dashboard.js";

      const profile = await requireAuth(["owner", "admin"]); // Allow both owner and admin

      if (profile) {
        document.getElementById("userName").textContent = profile.full_name;
        document.getElementById("userAvatar").textContent = profile.full_name
          .split(" ")
          .map((n) => n[0])
          .join("")
          .substring(0, 2)
          .toUpperCase();
        await loadPlansData();
        lucide.createIcons();
      }

      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => await logout());

      // Modal Logic
      const modal = document.getElementById("addPlanModal");
      const openBtn = document.getElementById("openPlanModalBtn");
      const closeBtn = document.getElementById("closePlanModalBtn");
      const cancelBtn = document.getElementById("cancelPlanModalBtn");
      const form = document.getElementById("addPlanForm");
      const tbody = document.getElementById("plansTableBody"); // For Event Delegation

      const openModal = () => {
        modal.style.display = "flex";
        lucide.createIcons();
      };
      const closeModal = () => {
        modal.style.display = "none";
        resetPlanModal();
      };

      // 1. Open Modal for NEW plan
      openBtn.addEventListener("click", () => {
        resetPlanModal();
        openModal();
      });

      closeBtn.addEventListener("click", closeModal);
      cancelBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });

      // 2. EVENT DELEGATION: Handle Edit and Delete clicks inside the table
      tbody.addEventListener("click", async (e) => {
        const editBtn = e.target.closest(".edit-plan-btn");
        const deleteBtn = e.target.closest(".delete-plan-btn");

        if (deleteBtn) {
          await deletePlan(deleteBtn.dataset.id);
        }

        if (editBtn) {
          // Find the plan data from the current table to pre-fill the modal
          const { data: plans } = await supabase
            .from("plans")
            .select("*")
            .eq("id", editBtn.dataset.id)
            .single();
          if (plans) {
            openEditModal(plans);
            openModal();
          }
        }
      });

      // 3. Form Submit (Handles BOTH Create and Update)
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById("savePlanBtn");
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";

        const editId = document.getElementById("editPlanId").value;
        const name = document.getElementById("planName").value;
        const description = document.getElementById("planDesc").value;
        const duration_months = parseInt(
          document.getElementById("planDuration").value,
        );
        const price = parseFloat(document.getElementById("planPrice").value);

        try {
          let error;
          if (editId) {
            // UPDATE existing plan
            const res = await supabase
              .from("plans")
              .update({ name, description, duration_months, price })
              .eq("id", editId);
            error = res.error;
          } else {
            // INSERT new plan
            const res = await supabase.from("plans").insert({
              name,
              description,
              duration_months,
              price,
              is_active: true,
            });
            error = res.error;
          }

          if (error) throw error;
          alert(editId ? "Plan updated!" : "Plan added!");
          closeModal();
          await loadPlansData();
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = editId ? "Update Plan" : "Save Plan";
        }
      });
    </script>
  </body>
</html>
