<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitSync - Loading...</title>
    <style>
        /* Reset and Full Screen Setup */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrolling */
            background-color: #ffffff; /* Matches the start of your video */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video Container */
        .video-loader {
            width: 50vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video Styling */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures the whole video is visible without cropping */
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="video-loader">
        <!-- The Video Player -->
        <!-- 'muted' is REQUIRED for autoplay to work in modern browsers -->
        <video id="introVideo" autoplay muted playsinline loop>
            <source src="./assets/videos/preloader (2).mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        // 1. Get the video element
        const video = document.getElementById('introVideo');

        // 2. Redirect to login.html EXACTLY when the video ends
        video.addEventListener('ended', () => {
            window.location.href = './login.html';
        });

        setTimeout(() => {
            window.location.href = './login.html';
        }, 10000); 
    </script>

</body>
</html>
