<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="shortcut icon" href="./assets/images/favicon.png" type="image/x-icon">
</head>

<body>
    <main class="main-content ">
        <span>hello</span>
<!-- =====================
                                           Form Starts Here ===================
      ==============================================================-->
        <div class="login-layout container">
            <form>
                <div class="mainLogo">
                    <img src="./assets/images/MainLogo.png" alt="">
                </div>
                <h1>Welcome Back</h1>
                <p>Enter your creidientials to manage your gym operations and dashboard .</p>
                <div class="loginFormInputBox">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-mail preview-icon">
                        <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
                        <rect x="2" y="4" width="20" height="16" rx="2" />
                    </svg>
                    <input type="email" name="userEmail" id="userEmail" class="form-input"
                        placeholder="name@fitSync.gym">
                </div>
                <div class="loginFormInputBox">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-lock preview-icon">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>

                    <input type="password" name="userPassword" id="userPassword" class="form-input"
                        placeholder="*********">

                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-eye preview-icon">
                        <path
                            d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </div>
                <div class="loginFormBox">
                    <label>
                        <input type="checkbox" id="rememberMe" name="remember" value="1">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>
                </div>
                <div class="loginFormBtn">
                    <button class="btn btn-primary"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-dumbbell preview-icon">
                            <path
                                d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z" />
                            <path d="m2.5 21.5 1.4-1.4" />
                            <path d="m20.1 3.9 1.4-1.4" />
                            <path
                                d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z" />
                            <path d="m9.6 14.4 4.8-4.8" />
                        </svg> Login</button>
                </div>
                <div class="form-ftr">
                    <hr>
                    <p>Don't have an account? <span>Contact your gym administrator</span></p>
                </div>
            </form>
        </div>
        <!-- =====================
                                           Form Ends Here ===================
      ==============================================================-->
        <!-- =====================
                                           Side Section Starts Here ===================
      ==============================================================-->
        <!-- =====================
                                           Side Section Ends Here ===================
      ==============================================================-->
    </main>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
